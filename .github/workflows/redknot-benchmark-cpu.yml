name: RedKnot benchmark CPU checks

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'tests/redknot/**'
      - 'scripts/run_redknot_benchmarks.sh'
      - '.github/workflows/redknot-benchmark-cpu.yml'
  push:
    branches: ['RedKnot+DeepInfer']
    paths:
      - 'benchmarks/**'
      - 'tests/redknot/**'
      - 'scripts/run_redknot_benchmarks.sh'
      - '.github/workflows/redknot-benchmark-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.3
      - run: python -m ruff check benchmarks tests/redknot
      - run: python -m ruff format --check benchmarks tests/redknot
      - run: python -m unittest discover -s tests/redknot -v
      - run: bash -n scripts/run_redknot_benchmarks.sh
